name: Build and publish my-celeste

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Install mono
        run: sudo apt-get install -y mono-devel

      - name: Build
        run: |
          cd loader && dotnet workload restore && cd ..
          make publish

      - name: Check file sizes (Cloudflare Pages limit is 25 MiB per file)
        run: |
          big=$(find frontend/dist -type f -size +25M)
          if [ -n "$big" ]; then echo "Files too big for Cloudflare Pages:"; echo "$big"; exit 1; fi

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          npx -y wrangler@4 pages project create my-celeste --production-branch=main || echo "project already exists"
          if [ -n "$SITE_PASSWORD" ]; then
            printf '%s' "$SITE_PASSWORD" | npx -y wrangler@4 pages secret put SITE_PASSWORD --project-name=my-celeste
          else
            echo "SITE_PASSWORD secret is missing: the site will stay locked for everyone"
          fi
          npx -y wrangler@4 pages deploy --branch=main --commit-dirty=true
