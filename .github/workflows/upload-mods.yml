name: Put the mod packs online

# Runs after every successful deploy (and by hand). Downloads Strawberry Jam,
# D-Sides, the skin and every mod they depend on, plus the Everest download,
# and stores them in the site's cloud storage. Skips any pack that is already
# up to date, so most runs finish in seconds.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and publish my-celeste"]
    types: [completed]

concurrency:
  group: upload-mods
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xxhash pyyaml
      - name: Upload packs
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 tools/upload_packs.py
